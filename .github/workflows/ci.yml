name: DepthCraft CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check depthcraft/ --output-format=github
      - name: Type check with mypy
        run: mypy depthcraft/ --ignore-missing-imports
      - name: Test with pytest
        run: pytest tests/ -v --cov=depthcraft --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU Docker image
        run: docker build -t depthcraft:cpu -f docker/Dockerfile.cpu .
      - name: Smoke-test the image
        run: docker run --rm depthcraft:cpu python -c "import depthcraft; print('OK')"
