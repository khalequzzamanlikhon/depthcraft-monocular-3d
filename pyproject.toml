[project]
name = "depthcraft"
version = "0.1.0"
description = "Monocular depth estimation + 3D reconstruction + virtual tape measure"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "open3d>=0.18",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "gradio>=4.0",
    "matplotlib>=3.7",
    "trimesh>=4.0",
]

[project.optional-dependencies]
depth = ["torch>=2.0", "torchvision", "transformers>=4.40"]
sfm = ["pycolmap>=0.4"]
masking = ["ultralytics", "sam2"]
splat = ["gsplat", "nerfstudio"]
onnx = ["onnx", "onnxruntime-gpu"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["depthcraft*"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
